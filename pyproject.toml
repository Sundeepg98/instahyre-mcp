[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instahyre-mcp"
version = "1.0.0"
description = "MCP server for Instahyre job search -- plain HTTP, no browser in the data path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Sundeep" }]
# The fastmcp cap is explained at length in requirements.txt; the short form is
# that its next UNKNOWN major (4.x) is code nobody has run this server against,
# and the suite is measured green on 3.4.7. The two files must agree --
# tests/test_requirements_pins.py compares them, because a cap applied to one
# source of truth and not the other protects nothing.
#
# jobcore is a REQUIRED runtime dependency and is deliberately NOT listed here.
# It is not on PyPI, so the only way to name it would be a git direct reference
# -- and a direct reference in THIS file makes `pip install -e .` silently
# uninstall a local `pip install -e ../jobcore` (measured; pip prints no
# "already satisfied" line for a direct URL, so the clobber is invisible).
# The install contract for this repo is requirements.txt + one of the two
# jobcore lines in README.md's Install block; requirements-ci.txt carries the
# pinned git URL for a sibling-free checkout. tests/test_requirements_pins.py
# asserts that arrangement rather than leaving it to convention.
dependencies = ["httpx>=0.27", "fastmcp>=2.0,<4"]

[project.optional-dependencies]
# Only needed for the Google OAuth sign-in path.
browser = ["playwright>=1.40"]
test = ["pytest>=8.0"]

[project.scripts]
instahyre-mcp = "instahyre_server.server:main"

[tool.setuptools.packages.find]
include = ["instahyre_server*"]

# pytest configuration lives in pytest.ini (it needs pythonpath=.), deliberately
# not duplicated here -- two sources of truth for test config is how a suite
# quietly stops running the way you think it does.
